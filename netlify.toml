# Statische site: geen build-stap, Netlify publiceert de root van de repository.
[build]
  publish = "."
  command = ""

# Basisbeveiliging
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Referentiebeelden zijn alleen voor ons, niet voor zoekmachines
[[headers]]
  for = "/referenties/*"
  [headers.values]
    X-Robots-Tag = "noindex"
